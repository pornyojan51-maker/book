<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>หน้าแรก</title>
</head>
<body>
   <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lumina Books | คลังหนังสือออนไลน์</title>
    <meta name="description" content="Lumina Books — แพลตฟอร์มอ่านหนังสือออนไลน์ฟรี เพียงสร้างบัญชีใหม่" />
    <meta http-equiv="refresh" content="2; url=E-Book Portal/index.html" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;700&display=swap" rel="stylesheet" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Kanit', 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }
        .loading-container {
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .logo { font-size: 3rem; margin-bottom: 16px; }
        h1 { font-size: 2rem; font-weight: 700; margin-bottom: 8px; }
        p { font-size: 1rem; opacity: 0.85; margin-bottom: 24px; }
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid #fff;
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 16px;
        }
        .fallback-link {
            color: #fff; text-decoration: underline;
            opacity: 0.8; font-size: 0.9rem;
        }
        .fallback-link:hover { opacity: 1; }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</body>
</html>
