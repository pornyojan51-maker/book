```html
<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lumina Books | คลังหนังสือออนไลน์</title>

    <meta name="description"
          content="Lumina Books — แพลตฟอร์มอ่านหนังสือออนไลน์ฟรี">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Kanit', 'Segoe UI', sans-serif;
            background: linear-gradient(
                135deg,
                #667eea 0%,
                #764ba2 100%
            );

            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            color: white;
        }

        .loading-container {
            width: min(90%, 500px);
            text-align: center;

            padding: 40px 30px;

            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.2);

            border-radius: 24px;

            backdrop-filter: blur(10px);

            box-shadow:
                0 20px 50px rgba(0, 0, 0, 0.2);

            animation: fadeIn 0.5s ease;
        }

        .logo {
            font-size: 3.5rem;
            margin-bottom: 10px;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            margin-bottom: 8px;
        }

        p {
            font-size: 1rem;
            font-weight: 300;
            opacity: 0.9;
            margin-bottom: 28px;
        }

        .spinner {
            width: 45px;
            height: 45px;

            border: 4px solid rgba(255,255,255,0.3);
            border-top: 4px solid white;

            border-radius: 50%;

            animation: spin 0.8s linear infinite;

            margin: 0 auto 20px;
        }

        .loading-text {
            font-size: 0.95rem;
            opacity: 0.85;
            margin-bottom: 20px;
        }

        .enter-button {
            display: inline-block;

            padding: 12px 25px;

            background: white;
            color: #3b3f9f;

            border-radius: 12px;

            text-decoration: none;

            font-weight: 500;

            transition: 0.2s ease;
        }

        .enter-button:hover {
            transform: translateY(-2px);

            box-shadow:
                0 8px 20px rgba(0,0,0,0.2);
        }

        .copyright {
            margin-top: 25px;
            font-size: 0.8rem;
            opacity: 0.65;
        }

        @keyframes spin {
            0% {
                transform: rotate(0deg);
            }

            100% {
                transform: rotate(360deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>

<body>

    <main class="loading-container">

        <div class="logo">📚</div>

        <h1>Lumina Books</h1>

        <p>
            คลังหนังสือออนไลน์
        </p>

        <div class="spinner"></div>

        <div class="loading-text">
            กำลังเข้าสู่ระบบ...
        </div>

        <!--
            ถ้า index.html นี้เป็นหน้าแรกของระบบ
            ไม่ต้องใช้ meta refresh
        -->

        <a href="./index.html" class="enter-button">
            เข้าสู่ Lumina Books
        </a>

        <div class="copyright">
            © 2026 Lumina Books
        </div>

    </main>

</body>
</html>
```
